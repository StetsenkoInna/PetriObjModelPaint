name: Feature request
description: Suggest an idea or improvement
labels: [enhancement]
body:
  - type: dropdown
    id: module
    attributes:
      label: Module
      description: Which part of the project does this affect?
      options:
        - petri-math (simulation engine)
        - petri-api
        - petri-model (graph model / PNML)
        - petri-swing-ui (desktop editor)
        - petri-server (REST/WebSocket server)
        - Not sure / new module
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: What are you trying to do that isn't currently possible or is awkward?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How would you like this to work?
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any workarounds or alternative approaches you've thought about.
    validations:
      required: false
