name: Bump version

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'New version, e.g. 2.6.0'
        required: true
      branch:
        description: 'Branch to bump and tag (blank = the default branch)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || github.event.repository.default_branch }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '23'
          cache: maven

      # Every place the version is written down, not only the poms: the PNML tool version,
      # the README download links and the library docs. See scripts/bump_version.py.
      - name: Set the version everywhere
        run: python3 scripts/bump_version.py "${{ inputs.version }}"

      # The gate: nothing is committed or tagged unless the bumped tree still passes.
      # ToolSpecificIdentityTest in particular checks the PNML tool version against the pom.
      - name: Test
        run: |
          python3 -m unittest discover -s scripts/tests
          mvn --batch-mode --no-transfer-progress test

      - name: Commit and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -u
          git commit -m "Bump project version to ${{ inputs.version }}"
          git tag "v${{ inputs.version }}"
          git push origin HEAD:"${{ inputs.branch || github.event.repository.default_branch }}"
          git push origin "v${{ inputs.version }}"
