name: Bump version

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'New version, e.g. 2.6.0'
        required: true
      branch:
        description: 'Branch to bump and tag (blank = the default branch)'
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    # Windows for the same reason as ci.yml: the Swing tests crash the JVM on Linux.
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || github.event.repository.default_branch }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '23'
          cache: maven

      # Every place the version is written down, not only the poms: the PNML tool version,
      # the README download links and the library docs. See scripts/bump_version.py.
      - name: Set the version everywhere
        run: python scripts/bump_version.py "${{ inputs.version }}"

      # The gate: nothing is committed or tagged unless the bumped tree still passes.
      # ToolSpecificIdentityTest in particular checks the PNML tool version against the pom.
      - name: Test
        run: |
          python -m unittest discover -s scripts/tests
          mvn --batch-mode --no-transfer-progress test

      # The default branch only accepts pull requests, so the bump arrives as one. The tag is
      # created when the GitHub Release is published from the merged commit, and the release
      # build checks that the tag and the source agree.
      - name: Open the version pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          base="${{ inputs.branch || github.event.repository.default_branch }}"
          branch="release/v${{ inputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add -u
          git commit -m "Bump project version to ${{ inputs.version }}"
          git push origin "$branch"
          gh pr create --base "$base" --head "$branch"             --title "Release ${{ inputs.version }}"             --body "Sets every version site to ${{ inputs.version }} with scripts/bump_version.py; the tests passed in the workflow. After merging, publish a GitHub Release with a new tag v${{ inputs.version }} on $base."
