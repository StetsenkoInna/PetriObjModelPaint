name: Release build

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing published release to rebuild (for example v2.6.0)'
        required: true
        type: string
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ inputs.release_tag || github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  swing-ui:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset-suffix: windows
            launcher: petri-swing-ui.bat
          - os: ubuntu-latest
            asset-suffix: linux
            launcher: petri-swing-ui.sh
          - os: macos-latest
            asset-suffix: macos
            launcher: petri-swing-ui.command
    runs-on: ${{ matrix.os }}
    steps:
      # lfs: true is load-bearing. Every icon under src/main/resources/ua/stetsenkoinna/img
      # is tracked by Git LFS, and a plain checkout writes 130-byte pointer files under those
      # names instead. Maven packages them happily, getResource() finds them, and ImageIcon
      # silently decodes nothing - the released app comes up with blank toolbar buttons.
      - uses: actions/checkout@v4
        with:
          lfs: true
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Check that a repair targets a published release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = false

      - name: Determine version
        id: version
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.event.release.tag_name }}
        run: echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"

      # A release cut from a tag whose source was never bumped would ship a jar stamping the
      # old version into every PNML file and a README linking the previous release. Run the
      # bump-version workflow first; this only checks that it was.
      - name: Check the source states this version
        if: runner.os == 'Linux'
        run: python3 scripts/bump_version.py --check "${{ steps.version.outputs.version }}"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '23'
          cache: maven

      - name: Build petri-swing-ui
        run: mvn --batch-mode --no-transfer-progress package -DskipTests -pl petri-swing-ui -am

      - name: Rename jar
        shell: bash
        run: |
          mv petri-swing-ui/target/petri-swing-ui.jar \
             petri-swing-ui/target/petri-swing-ui-${{ matrix.asset-suffix }}.jar

      - name: Package release zip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $stage = "petri-swing-ui-${{ steps.version.outputs.version }}-${{ matrix.asset-suffix }}"
          New-Item -ItemType Directory -Path $stage | Out-Null
          Copy-Item "petri-swing-ui/target/petri-swing-ui-${{ matrix.asset-suffix }}.jar" $stage
          Copy-Item "petri-swing-ui/packaging/${{ matrix.launcher }}" $stage
          Copy-Item "petri-swing-ui/packaging/README.md" $stage
          Copy-Item "petri-swing-ui/LICENSE" $stage
          Compress-Archive -Path "$stage/*" -DestinationPath "$stage.zip"

      - name: Package release zip (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          stage="petri-swing-ui-${{ steps.version.outputs.version }}-${{ matrix.asset-suffix }}"
          mkdir "$stage"
          cp "petri-swing-ui/target/petri-swing-ui-${{ matrix.asset-suffix }}.jar" "$stage/"
          cp "petri-swing-ui/packaging/${{ matrix.launcher }}" "$stage/"
          cp "petri-swing-ui/packaging/README.md" "$stage/"
          cp "petri-swing-ui/LICENSE" "$stage/"
          chmod +x "$stage/${{ matrix.launcher }}"
          zip -r "$stage.zip" "$stage"

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.event.release.tag_name }}
          files: petri-swing-ui-${{ steps.version.outputs.version }}-${{ matrix.asset-suffix }}.zip

  checksums:
    needs: swing-ui
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.release_tag || github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - name: Publish desktop checksums after all platforms succeed
        shell: bash
        run: |
          gh release download "$RELEASE_TAG" --pattern 'petri-swing-ui-*.zip'
          sha256sum petri-swing-ui-*.zip > SHA256SUMS-desktop.txt
          python3 scripts/desktop_update_manifest.py --version "${RELEASE_TAG#v}"
          gh release upload "$RELEASE_TAG" SHA256SUMS-desktop.txt --clobber
          gh release upload "$RELEASE_TAG" desktop-update.json --clobber
