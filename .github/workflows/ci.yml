name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '23'
          cache: maven

      # Every version site still agrees with the pom; see scripts/bump_version.py.
      - name: Scripts
        run: |
          python3 -m unittest discover -s scripts/tests
          python3 scripts/bump_version.py --check

      # The Swing tests build real windows, so they need a display even on a server.
      - name: Maven tests
        run: |
          command -v xvfb-run >/dev/null || (sudo apt-get update && sudo apt-get install -y xvfb)
          xvfb-run -a mvn --batch-mode --no-transfer-progress test
